<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Complaint - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 400px;
      margin: 100px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 {
      color: #cc0000;
      margin-bottom: 20px;
    }
    p {
      font-size: 16px;
      color: #333;
    }
    form {
      margin-top: 20px;
    }
    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
    }
    .confirm-btn {
      background: #cc0000;
      color: white;
    }
    .confirm-btn:hover {
      background: #990000;
    }
    .cancel-btn {
      background: #ccc;
      color: #333;
    }
    .cancel-btn:hover {
      background: #999;
      color: white;
    }
    a {
      text-decoration: none;
    }
     /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .container {
        width: 90%;
        margin: 50px auto;
        padding: 20px;
      }

      button {
        width: 45%;
        padding: 12px;
        font-size: 16px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    {% if messages %}
  {% for message in messages %}
    {% if 'complaint2' in message.tags %}
    <div style="
      background:#d4edda;
      color:#155724;
      padding:10px;
      margin:15px auto;
      width:90%;
      text-align:center;
      border-radius:6px;
      font-weight:600;
    ">
      {{ message }}
    </div>
    {% endif %}
  {% endfor %}
{% endif %}

    <h2>Delete Complaint</h2>
    <p>Are you sure you want to delete the complaint titled:</p>
    <p><strong>"{{ complaint.title }}"</strong>?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="confirm-btn">Yes, Delete</button>
      <a href="{% url 'admindashboard' %}">
        <button type="button" class="cancel-btn">Cancel</button>
      </a>
    </form>
  </div>
</body>
</html>
