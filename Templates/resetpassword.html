<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .reset-card {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h3 {
      margin-bottom: 20px;
      color: #333;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 10px 12px;
      background-color: #28a745;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #218838;
    }

    .messages p {
      color: red;
      margin: 10px 0;
    }
    .close {
  float: right;
  font-size: 24px;
  text-decoration: none;
  color: #999;
}

.close:hover {
  color: #f80707;
  cursor: pointer;
}
  </style>
</head>
<body>

  <div class="reset-card">
       <a href="{%url 'verifyotp' %}#" class="close">&times;</a>
    <h3>Reset Password</h3>

    <div class="messages">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>

    <form method="post" action="{% url 'resetpassword' %}">
      {% csrf_token %}
      <input type="password" name="password" placeholder="New Password" required>
      <input type="password" name="confirm" placeholder="Confirm Password" required>
      <button type="submit">Update Password</button>
    </form>
  </div>

</body>
</html>
