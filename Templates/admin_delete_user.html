<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete User - Admin</title>
  <style>
    /* ===== Body & General ===== */
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f6fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    /* ===== Container ===== */
    .container {
      width: 90%;
      max-width: 450px;
      margin: 80px auto;
      background-color: #fff;
      padding: 30px 25px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      text-align: center;
    }

    h2 {
      color: #e84118;
      margin-bottom: 20px;
    }

    p {
      font-size: 16px;
      color: #333;
      margin: 10px 0;
    }

    strong {
      color: #2f3640;
    }

    /* ===== Buttons ===== */
    .btn {
      padding: 12px 25px;
      margin: 10px 5px 0 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
      color: #fff;
    }

    .confirm-btn {
      background-color: #e84118;
    }

    .confirm-btn:hover {
      background-color: #c23616;
    }

    .cancel-btn {
      background-color: #7f8fa6;
    }

    .cancel-btn:hover {
      background-color: #718093;
    }

    a {
      text-decoration: none;
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .container {
        padding: 20px 15px;
        margin: 50px auto;
      }

      .btn {
        width: 100%;
        margin: 10px 0 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    {% if messages %}
     {% for message in messages %}
    {% if 'user1' in message.tags %}
    <div style="
      background:#d4edda;
      color:#155724;
      padding:10px;
      margin:15px auto;
      width:90%;
      text-align:center;
      border-radius:6px;
      font-weight:600;
    ">
      {{ message }}
    </div>
    {% endif %}
  {% endfor %}
{% endif %}
    <h2>Delete User</h2>
    <p>Are you sure you want to delete this user?</p>
    <p><strong>{{ user.username }}</strong></p>

    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn confirm-btn">Yes, Delete</button>
      <a href="{% url 'admindashboard' %}">
        <button type="button" class="btn cancel-btn">Cancel</button>
      </a>
    </form>
  </div>
</body>
</html>
